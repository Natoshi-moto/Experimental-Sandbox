name: NEXUS Public Workshop static

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nexus-public-workshop-static.yml"
      - "experiments/SBX-EXP-003-NEXUS-PUBLIC-WORKSHOP-STATIC/**"
  pull_request:
    paths:
      - ".github/workflows/nexus-public-workshop-static.yml"
      - "experiments/SBX-EXP-003-NEXUS-PUBLIC-WORKSHOP-STATIC/**"

permissions:
  contents: read

concurrency:
  group: nexus-public-workshop-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Pin verification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          check-latest: false
      - name: Verify preserved source manifest
        working-directory: experiments/SBX-EXP-003-NEXUS-PUBLIC-WORKSHOP-STATIC
        run: sha256sum --check MANIFEST.sha256
      - name: Install exact zero-dependency lockfile
        working-directory: experiments/SBX-EXP-003-NEXUS-PUBLIC-WORKSHOP-STATIC/prototype
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run scriptless production gate
        working-directory: experiments/SBX-EXP-003-NEXUS-PUBLIC-WORKSHOP-STATIC/prototype
        run: npm run build
